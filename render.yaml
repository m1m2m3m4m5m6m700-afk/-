# Render Blueprint for Flixo — Free tier Web Service.
# Deploys the existing Nitro `node-server` build as-is (no architecture changes).
# Render injects PORT (and HOST=0.0.0.0) which the Nitro node-server respects
# automatically — see .output/server/index.mjs (process.env.PORT / process.env.HOST).
#
# Create the service via Render Dashboard → New → Web Service → connect this repo,
# or use Blueprint sync. No secrets or env vars are required for the base deploy.
services:
  - type: web
    name: flixo-tools
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node .output/server/index.mjs
    autoDeploy: false
    healthCheckPath: /
