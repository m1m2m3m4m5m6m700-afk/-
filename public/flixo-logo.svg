<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Flixo AI — All Tools. One Place.</title>
  <desc id="desc">Official Flixo logo with a flowing brush mark, AI circuit emblem, FLIXO wordmark and the tagline All Tools. One Place.</desc>
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ffcf0"/>
      <stop offset="0.48" stop-color="#16d9d2"/>
      <stop offset="1" stop-color="#1685ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
