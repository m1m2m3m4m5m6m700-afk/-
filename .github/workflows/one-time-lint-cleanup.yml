name: one-time lint cleanup

on:
  push:
    branches:
      - dependency-lock-alignment

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct desktop lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('src/lib/desktop-tools/catalog.ts')
          text = catalog.read_text()
          text = text.replace('\\"', '"')
          catalog.write_text(text)

          runtimes = Path('src/lib/tool-runtime/desktop-runtimes.ts')
          registry = runtimes.read_text()
          registry = registry.replace(
              'export const desktopToolRuntimes: ReadyToolRuntimeDefinition[] ReadyToolRuntimeDefinition[] =',
              'export const desktopToolRuntimes: ReadyToolRuntimeDefinition[] =',
          )
          runtimes.write_text(registry)

          workflow = Path('.github/workflows/one-time-lint-cleanup.yml')
          workflow.unlink()
          PY

      - name: Commit and push final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize desktop lint cleanup"
          git push origin HEAD:dependency-lock-alignment
