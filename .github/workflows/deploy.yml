name: Deploy

# Production deployment is intentionally disabled during the integration-hardening phase.
# Keep this workflow as documentation; re-enable only after the full CI gate is green
# and an explicit release decision is made.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel (disabled during hardening)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deployment disabled
        run: |
          echo "Vercel production deployment is intentionally disabled during integration hardening."
          echo "Re-enable only after CI is fully green and release approval is explicit."
