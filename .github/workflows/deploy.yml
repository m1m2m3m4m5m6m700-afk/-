name: Deploy

# Production deployment remains intentionally disabled during the integration-hardening phase.
# The manual health-check path is safe and does not deploy anything.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      healthcheck_url:
        description: "Preview/production URL to health-check (no deployment is performed)"
        required: true
        default: "https://git-develop-flexo1.vercel.app"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel (disabled during hardening)
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deployment disabled
        run: |
          echo "Vercel production deployment is intentionally disabled during integration hardening."
          echo "Re-enable only after CI is fully green and release approval is explicit."

  health:
    name: Deployment Health Check (manual)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check root response
        env:
          TARGET_URL: ${{ inputs.healthcheck_url }}
        run: |
          set -euo pipefail
          echo "Health-check target: ${TARGET_URL}"
          curl --fail --show-error --silent --location --max-time 15 --retry 2 --retry-delay 2 "${TARGET_URL}" >/dev/null
      - name: Check expected tool route
        env:
          TARGET_URL: ${{ inputs.healthcheck_url }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 15 --retry 2 --retry-delay 2 "${TARGET_URL}/tools/image-compressor" >/dev/null
          curl --fail --show-error --silent --location --max-time 15 --retry 2 --retry-delay 2 "${TARGET_URL}/tools/image-enhancer" >/dev/null
