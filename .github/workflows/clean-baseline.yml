name: Clean Baseline Tool Gate

on:
  push:
    branches: [clean-baseline]
  pull_request:
    branches: [main, clean-baseline]
  workflow_dispatch:

concurrency:
  group: clean-baseline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify baseline and promoted desktop tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate promotion contract
        run: node scripts/validate-clean-baseline.mjs

      - name: Validate public runtimes
        run: npm run validate:tool-runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run promoted desktop regression
        run: npm run test:desktop -- --workers=1 --retries=0
