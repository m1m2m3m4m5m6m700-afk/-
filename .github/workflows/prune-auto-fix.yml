name: Prune auto-fix branches

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prune stale auto-fix branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/cleanup-auto-fix.sh
