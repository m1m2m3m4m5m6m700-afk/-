name: FLIXO Promotion Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: flixo-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: write

jobs:
  certify-and-gate:
    name: Certification + Promotion Gate
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout proposed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify source policy
        run: |
          test "$HEAD_BRANCH" = "experimental"
          test "$BASE_BRANCH" = "main"
          echo "Promotion candidate: $HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run promotion certification
        run: node scripts/promotion-gate.mjs

      - name: Publish certification summary
        run: |
          echo "## FLIXO Certification" >> "$GITHUB_STEP_SUMMARY"
          echo "CERTIFICATION: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "PROMOTION GATE: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
