name: Tool Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "scripts/verify-fast-gate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  pull_request:
    branches:
      - main
      - fix/e2e-stability-pdf-chat-a11y
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "scripts/verify-fast-gate.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: tool-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate (static + contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate package/lock contract before install
        run: node scripts/validate-package-lock-contract.mjs

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Run fast gate
        run: node scripts/verify-fast-gate.mjs fast

  medium-gate:
    name: Medium gate (deep validation)
    runs-on: ubuntu-latest
    needs: fast-gate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Run medium gate
        run: node scripts/verify-fast-gate.mjs medium

  full-certification:
    name: Full certification (browser + build + audit)
    runs-on: ubuntu-latest
    needs: medium-gate
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Verify Chromium can launch
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          console.log('Chromium launch: OK');
          NODE

      - name: Run non-QR public tool operational suite three times
        run: npx playwright test tests/desktop-tools.spec.ts tests/image-compressor.contract.spec.ts --grep-invert "QR Generator output correctness" --repeat-each=3 --reporter=line

      - name: Build production bundle
        run: npm run build

      - name: Production dependency audit
        run: npm run audit:production

      - name: Collect release evidence
        if: always()
        run: |
          mkdir -p .artifacts/release-tools
          cp -R .artifacts/verification-evidence .artifacts/release-tools/verification-evidence 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const summary = {
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              timestamp: new Date().toISOString(),
              verificationEvidence: fs.existsSync(".artifacts/verification-evidence"),
            };
            fs.writeFileSync(".artifacts/release-tools/summary.json", JSON.stringify(summary, null, 2) + "\n");
          '

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-release-candidate-${{ github.sha }}
          path: .artifacts/release-tools
          if-no-files-found: warn

  qr-output-certification:
    name: QR output certification
    runs-on: macos-latest
    needs: medium-gate
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Verify QR decoder capability
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const supported = await page.evaluate(async () => {
            const detector = globalThis.BarcodeDetector;
            if (!detector) return false;
            const formats = await detector.getSupportedFormats();
            return formats.includes('qr_code');
          });
          await browser.close();
          if (!supported) throw new Error('QR BarcodeDetector support is unavailable on the certification runner.');
          console.log('QR BarcodeDetector: OK');
          NODE

      - name: Run QR output certification three times
        run: npx playwright test tests/desktop-tools.spec.ts --grep "QR Generator output correctness" --repeat-each=3 --reporter=line
