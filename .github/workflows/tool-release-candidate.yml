name: Tool Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-tool-intake.mjs"
      - "scripts/verify-fast-gate.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  pull_request:
    branches:
      - main
      - fix/e2e-stability-pdf-chat-a11y
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-tool-intake.mjs"
      - "scripts/verify-fast-gate.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: tool-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate (static + contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate package/lock contract before install
        run: node scripts/validate-package-lock-contract.mjs

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Validate current tool intake
        env:
          TOOL_SLUG: qr-generator
        run: node scripts/validate-tool-intake.mjs

      - name: Run fast gate
        run: node scripts/verify-fast-gate.mjs fast

      - name: Publish fast-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-gate-${{ github.sha }}
          path: .artifacts/gates/fast-gate.json
          if-no-files-found: warn

  medium-gate:
    name: Medium gate (deep validation)
    runs-on: ubuntu-latest
    needs: fast-gate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Run medium gate
        run: node scripts/verify-fast-gate.mjs medium

      - name: Publish medium-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medium-gate-${{ github.sha }}
          path: .artifacts/gates/medium-gate.json
          if-no-files-found: warn

  environment-smoke:
    name: Cross-environment smoke (Windows)
    runs-on: windows-latest
    needs: fast-gate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate runtime and Playwright availability
        shell: pwsh
        run: |
          node --version
          npm --version
          npx playwright --version
          node -e "import('./scripts/validate-release-tools.mjs')"

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Chromium launch smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          node --input-type=module -e "import { chromium } from 'playwright'; const b = await chromium.launch({headless:true}); await b.close(); console.log('Chromium launch: OK')"

      - name: Publish environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: environment-smoke-${{ github.sha }}
          path: .artifacts/gates
          if-no-files-found: warn

  full-certification:
    name: Full certification (browser + E2E + build + audit)
    runs-on: ubuntu-latest
    needs: [medium-gate, environment-smoke]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Verify Chromium can launch
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          console.log('Chromium launch: OK');
          NODE

      - name: Run non-QR public tool operational suite three times
        run: npx playwright test tests/desktop-tools.spec.ts tests/image-compressor.contract.spec.ts --grep-invert "QR Generator output correctness" --repeat-each=3 --reporter=line

      - name: Build production bundle
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Collect full evidence
        if: always()
        run: |
          mkdir -p .artifacts/full
          cp -R .artifacts/gates .artifacts/full/gates 2>/dev/null || true
          node -e 'const fs=require("fs"); fs.writeFileSync(".artifacts/full/summary.json", JSON.stringify({commit:process.env.GITHUB_SHA, timestamp:new Date().toISOString(), status:process.env.GITHUB_JOB}, null, 2)+"\n")'

      - name: Publish full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-certification-${{ github.sha }}
          path: .artifacts/full
          if-no-files-found: warn

  qr-output-certification:
    name: QR output certification
    runs-on: macos-latest
    needs: medium-gate
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium

      - name: Verify QR decoder capability
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const supported = await page.evaluate(async () => {
            const detector = globalThis.BarcodeDetector;
            if (!detector) return false;
            const formats = await detector.getSupportedFormats();
            return formats.includes('qr_code');
          });
          await browser.close();
          if (!supported) throw new Error('QR BarcodeDetector support is unavailable on the certification runner.');
          console.log('QR BarcodeDetector: OK');
          NODE

      - name: Run QR output certification three times
        run: npx playwright test tests/desktop-tools.spec.ts --grep "QR Generator output correctness" --repeat-each=3 --reporter=line

      - name: Publish QR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qr-certification-${{ github.sha }}
          path: test-results
          if-no-files-found: warn

  release-decision:
    name: Release decision
    runs-on: ubuntu-latest
    needs: [full-certification, qr-output-certification]
    if: ${{ always() }}
    steps:
      - name: Enforce certification gates
        env:
          FULL_RESULT: ${{ needs.full-certification.result }}
          QR_RESULT: ${{ needs.qr-output-certification.result }}
        run: |
          echo "Full certification: ${FULL_RESULT}"
          echo "QR certification: ${QR_RESULT}"
          test "${FULL_RESULT}" = "success"
          test "${QR_RESULT}" = "success"
          echo "RELEASE DECISION: CERTIFIED"
