name: Tool Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  pull_request:
    branches:
      - main
      - fix/e2e-stability-pdf-chat-a11y
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: tool-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate package/lock contract before install
        run: node scripts/validate-package-lock-contract.mjs
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs
      - name: Validate current tool intake
        env:
          TOOL_SLUG: qr-generator
        run: node scripts/validate-tool-intake.mjs
      - name: Enforce certification policy
        env:
          TOOL_SLUG: qr-generator
        run: node scripts/validate-certification-policy.mjs
      - name: Run fast gate
        run: node scripts/verify-fast-gate.mjs fast
      - name: Write Fast Gate evidence manifest
        run: node scripts/write-gate-evidence.mjs fast .artifacts/gates/fast-gate.json
      - name: Publish Fast Gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fast-gate-${{ github.sha }}
          path: .artifacts/gates
          if-no-files-found: error

  medium-gate:
    name: Medium Gate
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs
      - name: Run medium gate
        run: node scripts/verify-fast-gate.mjs medium
      - name: Check performance regression against baseline
        env:
          TOOL_SLUG: qr-generator
        run: node scripts/validate-performance-regression.mjs
      - name: Write Medium Gate evidence manifest
        run: node scripts/write-gate-evidence.mjs medium .artifacts/gates/medium-gate.json
      - name: Publish Medium Gate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: medium-gate-${{ github.sha }}
          path: .artifacts/gates
          if-no-files-found: error
      - name: Publish performance regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-regression-${{ github.sha }}
          path: .artifacts/gates/performance-regression.json
          if-no-files-found: warn

  environment-smoke:
    name: Windows Smoke
    needs: fast-gate
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate runtime and Playwright availability
        shell: pwsh
        run: |
          node --version
          npm --version
          npx playwright --version
          node scripts/validate-release-tools.mjs
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Chromium launch smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          node --input-type=module -e "import { chromium } from 'playwright'; const b = await chromium.launch({headless:true}); await b.close(); console.log('Chromium launch: OK')"
      - name: Write Windows evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .artifacts/windows | Out-Null
          @{
            commit = $env:GITHUB_SHA
            runner = $env:RUNNER_OS
            node = (node --version)
            npm = (npm --version)
            playwright = (npx playwright --version)
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content .artifacts/windows/windows-smoke.json
      - name: Write Windows evidence manifest
        run: node scripts/write-gate-evidence.mjs windows .artifacts/windows/windows-smoke.json
      - name: Publish Windows evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-gate-${{ github.sha }}
          path: .artifacts/windows
          if-no-files-found: error

  qr-node:
    name: QR Node Gate
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install pinned test-only QR decoders
        run: npm install --no-save --package-lock=false jsqr@1.4.0 pngjs@7.0.0
      - name: Verify independent decoder imports
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          const require = createRequire(import.meta.url);
          const jsQR = require("jsqr");
          const { PNG } = require("pngjs");
          if (typeof jsQR !== "function") throw new Error("jsQR decoder import failed");
          if (!PNG?.sync?.read) throw new Error("pngjs decoder import failed");
          console.log("Independent Node QR decoders: OK");
          NODE
      - name: Run QR payload matrix
        run: |
          set -o pipefail
          mkdir -p .artifacts/qr-node
          node scripts/test-qr-payload-matrix.mjs | tee .artifacts/qr-node/node-matrix.json
      - name: Write QR Node evidence manifest
        run: node scripts/write-gate-evidence.mjs qr-node .artifacts/qr-node/node-matrix.json
      - name: Publish QR Node evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qr-node-${{ github.sha }}
          path: .artifacts/qr-node
          if-no-files-found: error

  qr-browser:
    name: QR Browser Gate
    needs: qr-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked project dependencies
        run: npm ci
      - name: Install pinned test-only QR decoders
        run: npm install --no-save --package-lock=false jsqr@1.4.0 pngjs@7.0.0
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Verify Chromium can launch
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          console.log("Chromium launch: OK");
          NODE
      - name: Run QR critical browser certification
        run: npx playwright test tests/qr-output-certification.spec.ts --reporter=line
      - name: Write QR Browser evidence
        run: |
          mkdir -p .artifacts/qr-browser
          node -e 'const fs=require("fs"); fs.writeFileSync(".artifacts/qr-browser/browser-gate.json", JSON.stringify({commit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, gate:"qr-browser", status:"PASS", timestamp:new Date().toISOString()}, null, 2)+"\n")'
      - name: Write QR Browser evidence manifest
        run: node scripts/write-gate-evidence.mjs qr-browser .artifacts/qr-browser/browser-gate.json
      - name: Publish QR Browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qr-browser-${{ github.sha }}
          path: |
            .artifacts/qr-browser
            test-results
          if-no-files-found: error

  qr-stability:
    name: QR Stability Gate
    needs: qr-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Run QR stability certification three times
        run: npx playwright test tests/qr-output-stability.spec.ts --repeat-each=3 --reporter=line
      - name: Write QR Stability evidence
        run: |
          mkdir -p .artifacts/qr-stability
          node -e 'const fs=require("fs"); fs.writeFileSync(".artifacts/qr-stability/stability-gate.json", JSON.stringify({commit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, gate:"qr-stability", status:"PASS", repeatEach:3, timestamp:new Date().toISOString()}, null, 2)+"\n")'
      - name: Write QR Stability evidence manifest
        run: node scripts/write-gate-evidence.mjs qr-stability .artifacts/qr-stability/stability-gate.json
      - name: Publish QR Stability evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qr-stability-${{ github.sha }}
          path: |
            .artifacts/qr-stability
            test-results
          if-no-files-found: error

  full-certification:
    name: Full Certification
    needs: [medium-gate, environment-smoke, qr-node, qr-browser, qr-stability]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install chromium
      - name: Verify Chromium can launch
        timeout-minutes: 3
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          console.log("Chromium launch: OK");
          NODE
      - name: Run non-QR public tool operational suite three times
        run: npx playwright test tests/desktop-tools.spec.ts tests/image-compressor.contract.spec.ts --grep-invert "QR Generator output correctness" --repeat-each=3 --reporter=line
      - name: Build production bundle
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Write Full evidence
        run: |
          mkdir -p .artifacts/full
          node -e 'const fs=require("fs"); fs.writeFileSync(".artifacts/full/full-gate.json", JSON.stringify({commit:process.env.GITHUB_SHA, runId:process.env.GITHUB_RUN_ID, gate:"full", status:"PASS", timestamp:new Date().toISOString()}, null, 2)+"\n")'
      - name: Write Full evidence manifest
        run: node scripts/write-gate-evidence.mjs full .artifacts/full/full-gate.json
      - name: Seal full evidence
        run: node scripts/seal-evidence.mjs .artifacts/full
      - name: Publish Full evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-gate-${{ github.sha }}
          path: .artifacts/full
          if-no-files-found: error

  failure-diagnosis:
    name: Evidence-first Failure Diagnosis
    needs: [fast-gate, medium-gate, environment-smoke, qr-node, qr-browser, qr-stability, full-certification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Diagnose first failure from GitHub evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/diagnose-ci-failure.mjs
      - name: Publish diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-failure-diagnosis-${{ github.sha }}
          path: .artifacts/diagnostics/ci-failure-diagnosis.json
          if-no-files-found: error

  release-decision:
    name: Release Decision + Certification
    needs: [fast-gate, medium-gate, environment-smoke, qr-node, qr-browser, qr-stability, full-certification, failure-diagnosis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download current-run gate evidence
        uses: actions/download-artifact@v7
        with:
          pattern: "*-${{ github.sha }}"
          path: .artifacts/evidence
          merge-multiple: false
        continue-on-error: true
      - name: Validate evidence identity and integrity
        env:
          EVIDENCE_ROOT: .artifacts/evidence
          CURRENT_COMMIT: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REQUIRED_GATES: fast,medium,windows,qr-node,qr-browser,qr-stability,full
        run: node scripts/validate-certification-evidence.mjs
      - name: Download failure diagnosis
        uses: actions/download-artifact@v7
        with:
          name: ci-failure-diagnosis-${{ github.sha }}
          path: .artifacts/diagnostics
        continue-on-error: true
      - name: Write machine-readable certification report
        env:
          TOOL_SLUG: qr-generator
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          FAST_RESULT: ${{ needs.fast-gate.result }}
          MEDIUM_RESULT: ${{ needs.medium-gate.result }}
          WINDOWS_RESULT: ${{ needs.environment-smoke.result }}
          FULL_RESULT: ${{ needs.full-certification.result }}
          QR_RESULT: ${{ needs.qr-stability.result }}
          DIAGNOSIS_RESULT: ${{ needs.failure-diagnosis.result }}
        run: node scripts/write-certification-report.mjs
      - name: Generate certification baseline when certified
        if: ${{ success() }}
        env:
          TOOL_SLUG: qr-generator
        run: node scripts/generate-certification-baseline.mjs
      - name: Seal certification evidence
        if: always()
        run: node scripts/seal-evidence.mjs .artifacts/release-tools
      - name: Publish certification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: certification-${{ github.sha }}
          path: .artifacts/release-tools
          if-no-files-found: error
      - name: Update PR certification summary
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/update-pr-certification-comment.mjs
