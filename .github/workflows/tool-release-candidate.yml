name: Tool Release Candidate

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lib/tool-platform/**"
      - "src/lib/tool-runtime/**"
      - "src/components/tools/**"
      - "src/data/**"
      - "src/routes/**"
      - "tests/**"
      - "scripts/validate-release-tools.mjs"
      - "scripts/validate-package-lock-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"

permissions:
  contents: read

concurrency:
  group: tool-release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Public tools release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate package/lock contract before install
        run: node scripts/validate-package-lock-contract.mjs

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lockfile
        run: node scripts/validate-lockfile.mjs

      - name: Tool release preflight
        run: |
          mkdir -p .artifacts/release-tools
          node scripts/validate-release-tools.mjs | tee .artifacts/release-tools/preflight.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public tool operational suite three times
        run: npx playwright test tests/desktop-tools.spec.ts tests/image-compressor.contract.spec.ts --repeat-each=3 --reporter=line

      - name: Build production bundle
        run: npm run build

      - name: Production dependency audit
        run: npm run audit:production

      - name: Collect release evidence
        if: always()
        run: |
          mkdir -p .artifacts/release-tools
          cp -R .artifacts/verification-evidence .artifacts/release-tools/verification-evidence 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const summary = {
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              timestamp: new Date().toISOString(),
              verificationEvidence: fs.existsSync(".artifacts/verification-evidence"),
            };
            fs.writeFileSync(".artifacts/release-tools/summary.json", JSON.stringify(summary, null, 2) + "\n");
          '

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-release-candidate-${{ github.sha }}
          path: .artifacts/release-tools
          if-no-files-found: warn
