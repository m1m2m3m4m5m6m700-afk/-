name: Early Detection · OSV

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  osv:
    name: OSV-Scanner · dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
