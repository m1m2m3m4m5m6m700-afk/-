name: Commit Readiness

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: commit-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-readiness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Commit readiness
        run: node scripts/validate-commit-readiness.mjs
