name: Lighthouse Advisory

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * 3"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse performance and UX audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.15.1 autorun
