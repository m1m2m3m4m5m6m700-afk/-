name: Security · Semgrep Community

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-semgrep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Community
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install Semgrep Community CLI
        run: python -m pip install --disable-pip-version-check semgrep
      - name: Scan TypeScript and JavaScript
        run: semgrep scan --config p/typescript --error --metrics=off
