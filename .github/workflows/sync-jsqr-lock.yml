name: One-shot jsqr lock sync
on:
  push:
    branches:
      - feat/certification-foundation-pdf-merge
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          ref: feat/certification-foundation-pdf-merge
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/sync-jsqr-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile change generated."
            exit 1
          fi
          git rm .github/workflows/sync-jsqr-lock.yml
          git commit -m "fix(deps): sync package lock for jsqr"
          git push origin HEAD:feat/certification-foundation-pdf-merge
