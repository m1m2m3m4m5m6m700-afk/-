name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".nvmrc"
      - "vercel.json"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".nvmrc"
      - "vercel.json"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate CI contract
        run: npm run validate-ci-contract
      - name: Validate dependencies
        run: npm run validate:dependencies
      - name: Install dependencies
        run: npm ci
      - name: Lockfile unchanged
        run: git diff --exit-code -- package.json package-lock.json
      - name: Production audit
        run: npm run audit:production
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Canonical verification
        run: npm run verify
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flixo-playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ~/.npm/_logs/
            diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Secrets scan
        run: node scripts/scan-secrets.mjs
      - name: CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  diagnosis:
    name: Failure Diagnosis
    needs: [verify, security]
    if: ${{ always() && (needs.verify.result == 'failure' || needs.security.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Run CI Failure Diagnostic Engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/diagnose-ci-failure.mjs
      - name: Upload Diagnostic Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-diagnosis-${{ github.run_id }}
          path: |
            .artifacts/diagnostics/ci-failure-diagnosis.json
            history/ci-failures.json
          if-no-files-found: ignore
          retention-days: 14
