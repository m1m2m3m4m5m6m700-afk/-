name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  e2e:
    name: E2E Shard ${{ matrix.shard }} / 6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-shard-${{ matrix.shard }}-of-6
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, security, e2e]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| E2E shards | ${{ needs.e2e.result }} |'
            echo
            echo 'Failed E2E shards upload traces, screenshots, video, HTML and JSON diagnostics as artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
