name: Strict CI

on:
  push:
    branches:
      - main
      - fix/ci-chat-null-regex-20260816
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation verification
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate CI contract
        run: npm run validate-ci-contract

      - name: Validate dependency contract
        run: npm run validate:dependencies

      - name: Install dependencies
        run: npm ci

      - name: Validate cross-layer integration contract
        run: npm run validate:integration

      - name: Install Chromium for operational tests
        run: npx playwright install --with-deps chromium

      - name: Production dependency audit
        run: npm run audit:production

      - name: Validate registry
        run: npm run validate:registry

      - name: Validate tool runtime
        run: npm run validate:tool-runtime

      - name: Validate tool quality publication contract
        run: npm run validate:tool-quality

      - name: Validate AI contract
        run: npm run validate:ai

      - name: Validate accessibility contract
        run: npm run validate:accessibility

      - name: Validate security contract
        run: npm run validate:security

      - name: Validate security hardening
        run: node scripts/validate-security-hardening.mjs

      - name: Validate mega-tool catalog
        run: node src/scripts/validate-mega-tools.mjs

      - name: Validate Google Search implementation
        run: node src/scripts/validate-google-search.mjs

      - name: Validate terminology profiles
        run: npm run validate:terminology-profiles

      - name: Validate SEO
        run: npm run validate:seo

      - name: Validate tool content
        run: npm run validate:tool-content

      - name: Validate localization
        run: npm run validate:localization

      - name: Validate localized pages and dictionaries
        run: node src/scripts/validate-localization-pages.mjs

      - name: Report localization health
        run: node src/scripts/report-localization-health.mjs

      - name: Validate RTL localization contract
        run: node src/scripts/validate-localization-rtl.mjs

      - name: Build and generate route tree
        run: npm run build

      - name: Validate generated route tree
        run: npm run validate:route-tree

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Flex chat browser tests
        run: npm run test:chat -- --retries=2
        timeout-minutes: 15

      - name: Run accessibility browser tests
        run: npm run test:a11y -- --retries=2
        timeout-minutes: 15

      - name: Run verified desktop/file tool browser tests
        run: npm run test:desktop -- --retries=2
        timeout-minutes: 25

      - name: Upload foundation browser report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: foundation-playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  mega-tools-smoke:
    name: Mega-tools Smoke Gate
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate mega-tool catalog
        run: node src/scripts/validate-mega-tools.mjs

      - name: Run Mega-tools smoke gate
        run: npx playwright test tests/mega-tools-smoke.spec.ts --workers=1 --retries=0
        timeout-minutes: 10

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mega-tools-smoke-${{ github.run_id }}
          path: |
            playwright-report
            test-results/mega-tools-report.json
          if-no-files-found: ignore
          retention-days: 14

  mega-tools:
    name: Mega-tools batch ${{ matrix.batch }}
    needs: mega-tools-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: true
      matrix:
        batch: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Mega-tools batch ${{ matrix.batch }}
        run: npx playwright test tests/mega-tools-part${{ matrix.batch }}.spec.ts --workers=1 --retries=2
        timeout-minutes: 30

      - name: Upload batch report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mega-tools-batch-${{ matrix.batch }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results/mega-tools-report.json
          if-no-files-found: ignore
          retention-days: 14
