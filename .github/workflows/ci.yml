name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".nvmrc"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Full Verification (main)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate CI contract
        run: npm run validate-ci-contract
      - name: Validate dependency contract
        run: npm run validate:dependencies
      - name: Install dependencies
        run: npm ci
      - name: Lockfile unchanged after install
        run: git diff --exit-code -- package.json package-lock.json
      - name: Production dependency audit
        run: npm run audit:production
      - name: Install Chromium for operational tests
        run: npx playwright install --with-deps chromium
      - name: Run canonical test gate
        run: npm test
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flixo-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: |
            ~/.npm/_logs/
            diagnostics/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
