name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (typecheck · lint · SEO · i18n · build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: Validate registry
        run: npm run validate:registry

      - name: Validate tool runtime
        run: npm run validate:tool-runtime

      - name: Validate tool contract
        run: npm run validate:tool-contract

      - name: Validate SEO
        run: npm run validate:seo

      - name: Validate tool content
        run: npm run validate:tool-content

      - name: Validate localization
        run: npm run validate:localization

      # The TanStack Vite plugin regenerates routeTree.gen.ts during build.
      # Generate it before typecheck so a newly added route cannot leave the
      # type system stuck on stale generated route definitions.
      - name: Build and generate route tree
        run: npm run build

      - name: Validate generated route tree
        run: npm run validate:route-tree

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output
          retention-days: 3
