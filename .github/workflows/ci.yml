name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (contract · typecheck · lint · SEO · i18n · terminology · desktop-tools · mega-tools · build)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate CI contract
        run: npm run validate-ci-contract

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for operational tests
        run: npx playwright install --with-deps chromium

      - name: Production dependency audit
        run: npm run audit:production

      - name: Validate registry
        run: npm run validate:registry

      - name: Validate tool runtime
        run: npm run validate:tool-runtime

      - name: Validate mega-tool catalog
        run: node src/scripts/validate-mega-tools.mjs

      - name: Validate Google Search implementation
        run: node src/scripts/validate-google-search.mjs

      - name: Validate terminology profiles
        run: node src/scripts/validate-terminology-profiles.mjs

      - name: Validate SEO
        run: npm run validate:seo

      - name: Validate tool content
        run: npm run validate:tool-content

      - name: Validate localization
        run: npm run validate:localization

      - name: Validate localized pages and dictionaries
        run: node src/scripts/validate-localization-pages.mjs

      - name: Report localization health
        run: node src/scripts/report-localization-health.mjs

      - name: Validate RTL localization contract
        run: node src/scripts/validate-localization-rtl.mjs

      - name: Build and generate route tree
        run: npm run build

      - name: Validate generated route tree
        run: npm run validate:route-tree

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Flex chat browser tests
        run: npx playwright test tests/chat.spec.ts

      - name: Run verified desktop/file tool browser tests
        run: npm run test:desktop

      - name: Run all 528 operational mega-tool tests
        run: npx playwright test tests/mega-tools.spec.ts

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build
          path: .vercel/output
          retention-days: 3

      - name: Upload chat browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flex-chat-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verified desktop/file tool report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-tools-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mega-tool browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-tool-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
