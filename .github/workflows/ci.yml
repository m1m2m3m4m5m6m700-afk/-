name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Production Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:production

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  e2e:
    name: E2E — ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: image-compressor
            spec: tests/image-compressor.spec.ts
          - tool: background-remover
            spec: tests/background-remover.spec.ts
          - tool: image-upscaler
            spec: tests/image-upscaler.spec.ts
          - tool: image-converter
            spec: tests/image-converter.spec.ts
          - tool: ai-image-generator
            spec: tests/ai-image-generator.spec.ts
          - tool: object-remover
            spec: tests/object-remover.spec.ts
          - tool: watermark-remover
            spec: tests/watermark-remover.spec.ts
          - tool: image-cropper
            spec: tests/image-cropper.spec.ts
          - tool: image-to-svg
            spec: tests/image-to-svg.spec.ts
          - tool: image-ocr
            spec: tests/image-ocr.spec.ts
          - tool: photo-colorizer
            spec: tests/photo-colorizer.spec.ts
          - tool: background-blur
            spec: tests/background-blur.spec.ts
          - tool: passport-photo-maker
            spec: tests/passport-photo-maker.spec.ts
          - tool: watermark-adder
            spec: tests/watermark-adder.spec.ts
          - tool: meme-generator
            spec: tests/meme-generator.spec.ts
          - tool: collage-maker
            spec: tests/collage-maker.spec.ts
          - tool: image-effects
            spec: tests/image-effects.spec.ts
          - tool: exif-cleaner
            spec: tests/exif-cleaner.spec.ts
          - tool: svg-optimizer
            spec: tests/svg-optimizer.spec.ts
          - tool: mockup-generator
            spec: tests/mockup-generator.spec.ts
          - tool: seed
            spec: tests/seed.spec.ts
          - tool: pix
            spec: tests/pix.spec.ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run ${{ matrix.tool }} E2E
        run: npx playwright test ${{ matrix.spec }}
      - name: Upload E2E diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics-${{ matrix.tool }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  i18n-contract:
    name: I18n — 440 route contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:i18n

  i18n-live:
    name: I18n — 440 live routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/i18n-matrix.spec.ts --workers=5
      - name: Upload i18n diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: i18n-matrix-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  diagnostic-summary:
    name: Diagnostic Summary
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, audit, security, e2e, i18n-contract, i18n-live]
    steps:
      - name: Write CI summary
        run: |
          {
            echo '## FLIXO CI Diagnostic Summary'
            echo
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo '| TypeScript | ${{ needs.typecheck.result }} |'
            echo '| ESLint | ${{ needs.lint.result }} |'
            echo '| Build | ${{ needs.build.result }} |'
            echo '| Audit | ${{ needs.audit.result }} |'
            echo '| CodeQL | ${{ needs.security.result }} |'
            echo '| Per-tool E2E | ${{ needs.e2e.result }} |'
            echo '| I18n — 440 route contract | ${{ needs.i18n-contract.result }} |'
            echo '| I18n — 440 live routes | ${{ needs.i18n-live.result }} |'
            echo
            echo 'The i18n gate covers 20 languages × 22 tools = 440 localized routes.'
          } >> "$GITHUB_STEP_SUMMARY"
