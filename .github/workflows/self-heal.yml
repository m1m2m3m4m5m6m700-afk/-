name: Self Heal Monitor

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Failed CI workflow run ID to diagnose"
        required: true
        type: string
      failed_sha:
        description: "Exact failed CI commit SHA"
        required: true
        type: string

concurrency:
  group: self-heal-manual-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read

jobs:
  diagnose-only:
    name: Manual CI Failure Diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ID: ${{ inputs.source_run_id }}
      FAILED_SHA: ${{ inputs.failed_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          test -n "$RUN_ID"
          test -n "$FAILED_SHA"
          echo "Manual self-heal is diagnosis-only. No repository mutation is permitted."

      - name: Checkout failed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.failed_sha }}
          fetch-depth: 0

      - name: Verify checkout integrity
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$FAILED_SHA" || {
            echo "ERROR: checked-out SHA does not match supplied failed SHA." >&2
            exit 1
          }
          git log -1 --pretty=fuller

      - name: Diagnose failed CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/diagnose.js

      - name: Upload diagnosis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-diagnosis-${{ inputs.source_run_id }}
          path: |
            .github/diagnosis-report.json
            .github/self-healing/logs/
          if-no-files-found: ignore
          retention-days: 14
