name: Self Heal Monitor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed CI workflow run ID to heal"
        required: true
        type: string

concurrency:
  group: self-heal-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  checks: read
  issues: write

env:
  REPOSITORY: ${{ github.repository }}
  SELF_HEAL_MAX_TEST_RUNS_PER_HOUR: "2"
  SELF_HEAL_ARTIFACT_RETENTION_DAYS: "7"

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve source CI run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_RUN_ID="$WORKFLOW_RUN_ID"
          else
            SOURCE_RUN_ID="$MANUAL_RUN_ID"
          fi

          if [ -z "$SOURCE_RUN_ID" ]; then
            echo "ERROR: source CI run ID is empty." >&2
            exit 1
          fi

          SOURCE_JSON="$(gh api "/repos/$REPO/actions/runs/$SOURCE_RUN_ID")"
          SOURCE_NAME="$(jq -r '.name' <<<"$SOURCE_JSON")"
          SOURCE_STATUS="$(jq -r '.status' <<<"$SOURCE_JSON")"
          SOURCE_CONCLUSION="$(jq -r '.conclusion // empty' <<<"$SOURCE_JSON")"
          FAILED_SHA="$(jq -r '.head_sha' <<<"$SOURCE_JSON")"
          FAILED_BRANCH="$(jq -r '.head_branch' <<<"$SOURCE_JSON")"

          test "$SOURCE_NAME" = "CI" || {
            echo "ERROR: source run $SOURCE_RUN_ID is '$SOURCE_NAME', not CI." >&2
            exit 1
          }
          test "$SOURCE_STATUS" = "completed" || {
            echo "ERROR: source CI run $SOURCE_RUN_ID is not completed (status=$SOURCE_STATUS)." >&2
            exit 1
          }
          test -n "$FAILED_SHA" || {
            echo "ERROR: source CI run has no head_sha." >&2
            exit 1
          }

          printf '%s\n' "$SOURCE_JSON" > source-ci-run.json
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "FAILED_SHA=$FAILED_SHA" >> "$GITHUB_ENV"
          echo "FAILED_BRANCH=$FAILED_BRANCH" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=$SOURCE_CONCLUSION" >> "$GITHUB_ENV"
          if [[ "$FAILED_BRANCH" == test/self-heal-pr-* ]]; then
            echo "SELF_HEAL_MODE=pr" >> "$GITHUB_ENV"
          else
            echo "SELF_HEAL_MODE=dry-run" >> "$GITHUB_ENV"
          fi

          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"
          echo "SOURCE_HEAD_SHA=$FAILED_SHA"
          echo "SOURCE_HEAD_BRANCH=$FAILED_BRANCH"
          echo "SOURCE_CONCLUSION=$SOURCE_CONCLUSION"

      - name: Dump event context
        if: always()
        env:
          EVENT_JSON: ${{ toJson(github.event) }}
        shell: bash
        run: |
          printf '%s\n' "$EVENT_JSON" > workflow_event.json

      - name: Decide whether healing is required
        id: gate
        shell: bash
        run: |
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID"
          echo "SOURCE_HEAD_SHA=$FAILED_SHA"
          echo "SOURCE_HEAD_BRANCH=$FAILED_BRANCH"
          echo "SOURCE_CONCLUSION=$SOURCE_CONCLUSION"
          echo "SELF_HEAL_MODE=$SELF_HEAL_MODE"
          if [ "$SOURCE_CONCLUSION" = "failure" ]; then
            echo "should_heal=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_heal=false" >> "$GITHUB_OUTPUT"
            echo "Self-heal not required; source CI conclusion is $SOURCE_CONCLUSION."
          fi

      - name: Enforce experimental rate limit
        if: steps.gate.outputs.should_heal == 'true' && startsWith(env.FAILED_BRANCH, 'test/self-heal-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          now=$(date +%s)
          cutoff=$((now - 3600))
          count=0
          while IFS= read -r created_at; do
            [ -z "$created_at" ] && continue
            ts=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            if [ "$ts" -ge "$cutoff" ]; then count=$((count + 1)); fi
          done < <(gh run list --workflow self-heal.yml --limit 20 --json createdAt --jq '.[].createdAt')
          echo "Self-Heal test runs in the last hour: $count"
          if [ "$count" -gt "$SELF_HEAL_MAX_TEST_RUNS_PER_HOUR" ]; then
            echo "Rate limit reached for experimental self-heal runs; exiting without mutation."
            exit 0
          fi

      - name: Validate failed SHA
        if: steps.gate.outputs.should_heal == 'true'
        shell: bash
        run: |
          test -n "$FAILED_SHA" || {
            echo "ERROR: resolved failed SHA is empty." >&2
            exit 1
          }

      - name: Checkout failed revision
        if: steps.gate.outputs.should_heal == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAILED_SHA }}
          fetch-depth: 0

      - name: Verify checkout integrity
        if: steps.gate.outputs.should_heal == 'true'
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EVENT/RESOLVED HEAD SHA: $FAILED_SHA"
          echo "GIT HEAD: $ACTUAL_SHA"
          git status --porcelain
          git log -1 --pretty=fuller
          test "$ACTUAL_SHA" = "$FAILED_SHA" || {
            echo "ERROR: checked-out SHA does not match source CI SHA." >&2
            exit 1
          }

      - name: Setup Node
        if: steps.gate.outputs.should_heal == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect and classify failure
        if: steps.gate.outputs.should_heal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ env.SOURCE_RUN_ID }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/diagnose.js

      - name: Prepare debug artifacts
        if: steps.gate.outputs.should_heal == 'true'
        env:
          DEBUG_DIR: ${{ runner.temp }}/self-heal-debug-${{ env.SOURCE_RUN_ID }}
        shell: bash
        run: |
          umask 077
          mkdir -p "$DEBUG_DIR"
          : > "$DEBUG_DIR/npm.out"
          npm config list --json > "$DEBUG_DIR/npm-config.json" 2>/dev/null || echo "{}" > "$DEBUG_DIR/npm-config.json"
          git status --porcelain > "$DEBUG_DIR/git-status-before.txt" || true
          git diff --cached --name-only > "$DEBUG_DIR/git-staged-before.txt" || true
          ls -la package-lock.json > "$DEBUG_DIR/package-lock-ls-before.txt" 2>&1 || true
          stat -c '%s %n' package-lock.json > "$DEBUG_DIR/package-lock-stat-before.txt" 2>&1 || true

      - name: Attempt safe self-healing
        if: steps.gate.outputs.should_heal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ env.SOURCE_RUN_ID }}
          REPOSITORY: ${{ github.repository }}
          SELF_HEAL_MODE: ${{ env.SELF_HEAL_MODE }}
          DEBUG_DIR: ${{ runner.temp }}/self-heal-debug-${{ env.SOURCE_RUN_ID }}
        shell: bash
        run: |
          set +e
          mkdir -p "$DEBUG_DIR"
          node .github/scripts/auto-correct.js > >(tee "$DEBUG_DIR/npm.out") 2> >(tee -a "$DEBUG_DIR/npm.out" >&2)
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Finalize debug artifacts
        if: always()
        env:
          DEBUG_DIR: ${{ runner.temp }}/self-heal-debug-${{ env.SOURCE_RUN_ID || github.run_id }}
        shell: bash
        run: |
          umask 077
          mkdir -p "$DEBUG_DIR"
          git status --porcelain > "$DEBUG_DIR/git-status-after.txt" || true
          git diff --cached --name-only > "$DEBUG_DIR/git-staged-after.txt" || true
          git diff --cached -- package-lock.json > "$DEBUG_DIR/staged-package-lock.diff" || true
          git diff -- package-lock.json > "$DEBUG_DIR/working-package-lock.diff" || true
          ls -la package-lock.json > "$DEBUG_DIR/package-lock-ls.txt" 2>&1 || true
          stat -c '%s %n' package-lock.json > "$DEBUG_DIR/package-lock-stat.txt" 2>&1 || true

      - name: Upload self-healing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-full-artifacts-${{ env.SOURCE_RUN_ID || github.run_id }}
          path: |
            ${{ runner.temp }}/self-heal-debug-${{ env.SOURCE_RUN_ID || github.run_id }}/
            source-ci-run.json
            workflow_event.json
            .github/self-healing/logs/
            .github/diagnosis-report.json
          if-no-files-found: ignore
          retention-days: ${{ env.SELF_HEAL_ARTIFACT_RETENTION_DAYS }}
