name: Self Heal Monitor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  monitor-and-heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect and classify failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/diagnose.js

      - name: Attempt safe self-healing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/auto-correct.js

      - name: Upload self-healing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-${{ github.event.workflow_run.id }}
          path: |
            .github/self-healing/logs/
            .github/diagnosis-report.json
          if-no-files-found: ignore
          retention-days: 14
