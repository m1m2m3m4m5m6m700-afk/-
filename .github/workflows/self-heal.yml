name: Self Heal Monitor

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

env:
  FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
  FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
  SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
  SELF_HEAL_MODE: ${{ startsWith(github.event.workflow_run.head_branch, 'test/self-heal-pr-') && 'pr' || 'dry-run' }}

jobs:
  monitor-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide whether healing is required
        id: gate
        shell: bash
        run: |
          echo "SOURCE_RUN_ID=${{ github.event.workflow_run.id }}"
          echo "SOURCE_HEAD_SHA=$FAILED_SHA"
          echo "SOURCE_HEAD_BRANCH=$FAILED_BRANCH"
          echo "SOURCE_CONCLUSION=$SOURCE_CONCLUSION"
          echo "SELF_HEAL_MODE=$SELF_HEAL_MODE"
          if [ "$SOURCE_CONCLUSION" = "failure" ]; then
            echo "should_heal=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_heal=false" >> "$GITHUB_OUTPUT"
            echo "Self-heal not required; source CI conclusion is $SOURCE_CONCLUSION."
          fi

      - name: Validate failed SHA
        if: steps.gate.outputs.should_heal == 'true'
        shell: bash
        run: |
          if [ -z "$FAILED_SHA" ]; then
            echo "ERROR: workflow_run.head_sha is empty. Aborting self-heal." >&2
            exit 1
          fi

      - name: Checkout failed revision
        if: steps.gate.outputs.should_heal == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FAILED_SHA }}
          fetch-depth: 0

      - name: Verify checkout integrity
        if: steps.gate.outputs.should_heal == 'true'
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "EVENT HEAD SHA: $FAILED_SHA"
          echo "GIT HEAD: $ACTUAL_SHA"
          echo "GIT BRANCH: $(git rev-parse --abbrev-ref HEAD || true)"
          git status --porcelain
          git log -1 --pretty=fuller
          test "$ACTUAL_SHA" = "$FAILED_SHA" || {
            echo "ERROR: checked-out SHA does not match failed workflow SHA." >&2
            exit 1
          }

      - name: Setup Node
        if: steps.gate.outputs.should_heal == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Collect and classify failure
        if: steps.gate.outputs.should_heal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/diagnose.js

      - name: Prepare debug artifacts
        if: steps.gate.outputs.should_heal == 'true'
        shell: bash
        run: |
          : > npm.out
          npm config list --json > npm-config.json 2>/dev/null || echo "{}" > npm-config.json
          git status --porcelain > git-status-before.txt || true
          git diff --cached --name-only > git-staged-before.txt || true
          ls -la package-lock.json > package-lock-ls-before.txt 2>&1 || true
          stat -c '%s %n' package-lock.json > package-lock-stat-before.txt 2>&1 || true

      - name: Attempt safe self-healing
        if: steps.gate.outputs.should_heal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          SELF_HEAL_MODE: ${{ env.SELF_HEAL_MODE }}
        shell: bash
        run: |
          set +e
          node .github/scripts/auto-correct.js > >(tee npm.out) 2> >(tee -a npm.out >&2)
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Finalize debug artifacts
        if: always()
        shell: bash
        run: |
          git status --porcelain > git-status-after.txt || true
          git diff --cached --name-only > git-staged-after.txt || true
          git diff --cached -- package-lock.json > staged-package-lock.diff || true
          git diff -- package-lock.json > working-package-lock.diff || true
          ls -la package-lock.json > package-lock-ls.txt 2>&1 || true
          stat -c '%s %n' package-lock.json > package-lock-stat.txt 2>&1 || true
          if git rev-parse --verify auto-fix/lockfile-fixer/${{ github.event.workflow_run.id }} >/dev/null 2>&1; then
            git log -1 --pretty=fuller auto-fix/lockfile-fixer/${{ github.event.workflow_run.id }} > auto-fix-branch-log.txt 2>&1 || true
          else
            echo "auto-fix branch not present in this checkout" > auto-fix-branch-log.txt
          fi
          git status --porcelain=v1 > git-status-final.txt || true

      - name: Upload self-healing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-full-artifacts-${{ github.event.workflow_run.id }}
          path: |
            npm.out
            npm-config.json
            git-status-before.txt
            git-status-after.txt
            git-staged-before.txt
            git-staged-after.txt
            git-status-final.txt
            package-lock-ls-before.txt
            package-lock-stat-before.txt
            package-lock-ls.txt
            package-lock-stat.txt
            staged-package-lock.diff
            working-package-lock.diff
            auto-fix-branch-log.txt
            .github/self-healing/logs/
            .github/diagnosis-report.json
          if-no-files-found: ignore
          retention-days: 14
