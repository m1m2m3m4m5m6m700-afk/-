name: Experimental Auto Repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: experimental-auto-repair-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write

jobs:
  diagnose-and-repair:
    name: Diagnose and Repair experimental only
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
      REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: experimental
    steps:
      - name: Checkout exact failed experimental revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.FAILED_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify failed revision and branch policy
        shell: bash
        run: |
          test "$FAILED_BRANCH" = "experimental"
          test "$(git rev-parse HEAD)" = "$FAILED_SHA"
          echo "Source branch: $FAILED_BRANCH"
          echo "Source SHA: $FAILED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Diagnose failed CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/diagnose.js

      - name: Run experimental-only repair policy tests
        run: node --test .github/scripts/experimental-auto-repair.test.mjs

      - name: Execute guarded repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/experimental-auto-repair.mjs

      - name: Upload repair decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-auto-repair-${{ github.event.workflow_run.id }}
          path: |
            .github/diagnosis-report.json
            .github/self-healing/logs/
          if-no-files-found: ignore
          retention-days: 14
