name: CI Fast

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Fast Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate CI contract
        timeout-minutes: 1
        run: npm run validate-ci-contract

      - name: Validate dependency contract
        timeout-minutes: 1
        run: npm run validate:dependencies

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Validate integration
        timeout-minutes: 1
        run: npm run validate:integration

      - name: Fast registry/runtime/security gates
        timeout-minutes: 2
        run: |
          npm run validate:registry
          npm run validate:tool-runtime
          npm run validate:ai
          npm run validate:accessibility
          npm run validate:security
          node src/scripts/validate-mega-tools.mjs

      - name: Build and generate route tree
        timeout-minutes: 4
        run: npm run build

      - name: Validate generated route tree
        timeout-minutes: 1
        run: npm run validate:route-tree

      - name: Typecheck
        timeout-minutes: 3
        run: npm run typecheck

      - name: Lint
        timeout-minutes: 3
        run: npm run lint

      - name: Fast-path summary
        if: always()
        run: |
          echo "CI Fast covers foundation checks only; stale runs are cancelled."
          echo "Full browser/regression coverage remains in CI."
