name: CI Fast

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  foundation:
    name: Fast Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate CI contract
        timeout-minutes: 1
        run: npm run validate-ci-contract

      - name: Validate dependency contract
        timeout-minutes: 1
        run: npm run validate:dependencies

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci

      - name: Validate integration
        timeout-minutes: 1
        run: npm run validate:integration

      - name: Fast registry/runtime/security gates
        timeout-minutes: 2
        run: |
          npm run validate:registry
          npm run validate:tool-runtime
          npm run validate:ai
          npm run validate:accessibility
          npm run validate:security
          node src/scripts/validate-mega-tools.mjs

      - name: Build and generate route tree
        timeout-minutes: 4
        run: npm run build

      - name: Validate generated route tree
        timeout-minutes: 1
        run: npm run validate:route-tree

      - name: Typecheck
        timeout-minutes: 3
        run: npm run typecheck

      - name: Lint
        timeout-minutes: 3
        run: npm run lint

  chat:
    name: Fast Chat
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
      - name: Run chat tests
        timeout-minutes: 3
        run: npx playwright test tests/chat.spec.ts --workers=1 --retries=0

  accessibility:
    name: Fast Accessibility
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        timeout-minutes: 3
        run: npx playwright test tests/accessibility.spec.ts --workers=1 --retries=0

  desktop:
    name: Fast Desktop
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
      - name: Run desktop tests
        timeout-minutes: 5
        run: npx playwright test tests/desktop-tools.spec.ts --workers=1 --retries=0

  mega:
    name: Fast Mega-tools
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install --with-deps chromium
      - name: Run mega-tools tests
        timeout-minutes: 7
        run: npx playwright test tests/mega-tools.spec.ts --workers=1 --retries=0
