name: Tool Platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tool-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  foundation:
    name: Strict Project Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Strict verification foundation
        run: npm run verify:foundation
      - name: Performance budget
        run: npm run validate:performance
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-diagnostics
          path: |
            playwright-report
            test-results
            .output
          if-no-files-found: ignore

  desktop-contract:
    name: Strict Desktop Verification
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verification contract
        run: npm run validate:tool-platform-regression
      - name: Test quality and isolation
        run: npm run validate:test-quality && npm run validate:flaky-isolation && npm run validate:failure-quality
      - name: Mutation testing
        run: npm run test:mutation
      - name: Real desktop verification with repeatability
        run: npm run test:desktop:flaky
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
