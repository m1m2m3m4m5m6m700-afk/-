name: Tool Platform

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tool-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  foundation:
    name: Tool Platform Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Architecture and platform contract
        run: node src/scripts/validate-tool-platform.mjs
      - name: Lifecycle contract
        run: node src/scripts/validate-tool-platform-lifecycle.mjs
      - name: Build and generate route tree
        run: npm run build
      - name: Typecheck against generated route tree
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  desktop-contract:
    name: Desktop Tool Verification
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate desktop verification contract
        run: node src/scripts/validate-tool-platform-regression.mjs
      - name: Run real desktop verification tests
        run: npm run test:desktop
