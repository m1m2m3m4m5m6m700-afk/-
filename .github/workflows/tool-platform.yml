name: Tool Platform

# Deferred until the tool-platform contracts and validators are implemented on main.
# Keep this workflow available for explicit, manual activation without making it
# part of the release-critical CI path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-platform-manual
  cancel-in-progress: true

jobs:
  deferred:
    name: Deferred tool-platform gate
    runs-on: ubuntu-latest
    steps:
      - name: Explain deferred state
        run: |
          echo "Tool Platform verification is intentionally deferred."
          echo "The release-critical CI path only runs contracts that exist on main."
          echo "Re-enable the full workflow only when every referenced validator/script is present and tested."
