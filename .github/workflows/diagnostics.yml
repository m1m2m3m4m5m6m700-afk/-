name: Diagnostics

on:
  push:
    branches: [main, feat/seo-cwv-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Deterministic Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run diagnostic suite
        run: npm run diagnostics
      - name: Upload diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: flixo-diagnostic-report-${{ github.sha }}
          path: artifacts/diagnostics/diagnostic-report.json
          if-no-files-found: warn
          retention-days: 14
