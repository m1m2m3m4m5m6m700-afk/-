name: PDF Merge Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/tools/PdfMerge.tsx"
      - "src/lib/tool-runtime/tools/pdf-merge.tsx"
      - "src/lib/tool-runtime/readyTools.ts"
      - "src/lib/tool-platform/**"
      - "src/data/toolContent.ts"
      - "src/data/toolSeo.ts"
      - "src/data/tools.ts"
      - "tests/pdf-merge-*.spec.ts"
      - "scripts/test-pdf-merge-correctness.mjs"
      - "scripts/certification/**"
      - "scripts/validate-release-tools.mjs"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-merge-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOOL_SLUG: pdf-merge
  BASELINE_ID: qr-generator-baseline-v1
  BASELINE_COMMIT: 059b269cda951284e150c79f08fa60a699f75697
  BASELINE_STATUS: frozen

jobs:
  fast:
    name: PDF Merge — Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Validate public tool governance
        run: node scripts/validate-release-tools.mjs
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          mkdir -p .artifacts/pdf-merge/fast
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = {
            schemaVersion: 1,
            tool: "pdf-merge",
            gate: "fast",
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            status: process.env.GATE_STATUS,
            createdAt: new Date().toISOString()
          };
          fs.writeFileSync(".artifacts/pdf-merge/fast/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=fast GATE_STATUS="$GATE_STATUS" \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/fast/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-fast
          path: .artifacts/pdf-merge/fast
          if-no-files-found: error

  medium:
    name: PDF Merge — Medium Gate
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Validate public tool governance
        run: node scripts/validate-release-tools.mjs
      - name: Run medium validation
        run: node scripts/validate-release-tools.mjs
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          mkdir -p .artifacts/pdf-merge/medium
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = { schemaVersion: 1, tool: "pdf-merge", gate: "medium", commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, status: process.env.GATE_STATUS, createdAt: new Date().toISOString() };
          fs.writeFileSync(".artifacts/pdf-merge/medium/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=medium GATE_STATUS="$GATE_STATUS" \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/medium/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-medium
          path: .artifacts/pdf-merge/medium
          if-no-files-found: error

  correctness:
    name: PDF Merge — Correctness
    needs: medium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Run independent correctness gate
        run: |
          mkdir -p .artifacts/pdf-merge/correctness
          node scripts/test-pdf-merge-correctness.mjs | tee .artifacts/pdf-merge/correctness/correctness.json
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = { schemaVersion: 1, tool: "pdf-merge", gate: "correctness", commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, status: process.env.GATE_STATUS, createdAt: new Date().toISOString() };
          fs.writeFileSync(".artifacts/pdf-merge/correctness/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=correctness GATE_STATUS="$GATE_STATUS" \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/correctness/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-correctness
          path: .artifacts/pdf-merge/correctness
          if-no-files-found: error

  browser:
    name: PDF Merge — Browser Critical
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: npx playwright install chromium
        timeout-minutes: 8
      - name: Run critical browser certification
        run: npx playwright test tests/pdf-merge-certification.spec.ts --reporter=line
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          mkdir -p .artifacts/pdf-merge/browser
          cp -R test-results .artifacts/pdf-merge/browser/test-results 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = { schemaVersion: 1, tool: "pdf-merge", gate: "browser", commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, status: process.env.GATE_STATUS, createdAt: new Date().toISOString() };
          fs.writeFileSync(".artifacts/pdf-merge/browser/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=browser GATE_STATUS="$GATE_STATUS" \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/browser/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-browser
          path: .artifacts/pdf-merge/browser
          if-no-files-found: error

  stability:
    name: PDF Merge — Stability x3
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - run: npx playwright install chromium
        timeout-minutes: 8
      - name: Run stability certification three times
        run: npx playwright test tests/pdf-merge-stability.spec.ts --repeat-each=3 --reporter=line
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          mkdir -p .artifacts/pdf-merge/stability
          cp -R test-results .artifacts/pdf-merge/stability/test-results 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = { schemaVersion: 1, tool: "pdf-merge", gate: "stability", commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, status: process.env.GATE_STATUS, repeatCount: 3, createdAt: new Date().toISOString() };
          fs.writeFileSync(".artifacts/pdf-merge/stability/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=stability GATE_STATUS="$GATE_STATUS" REPEAT_COUNT=3 \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/stability/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-stability
          path: .artifacts/pdf-merge/stability
          if-no-files-found: error

  full:
    name: PDF Merge — Full Certification
    needs: [fast, medium, correctness, browser, stability]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start gate timer
        run: echo "GATE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Publish gate evidence
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          mkdir -p .artifacts/pdf-merge/full
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = { schemaVersion: 1, tool: "pdf-merge", gate: "full", commit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, status: process.env.GATE_STATUS, createdAt: new Date().toISOString() };
          fs.writeFileSync(".artifacts/pdf-merge/full/gate-evidence.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
      - name: Create gate manifest
        if: always()
        env: { GATE_STATUS: ${{ job.status }} }
        run: |
          DURATION_MS=$(( $(date +%s%3N) - GATE_STARTED_MS )) \
          TOOL="$TOOL_SLUG" GATE=full GATE_STATUS="$GATE_STATUS" \
          BASELINE_ID="$BASELINE_ID" BASELINE_COMMIT="$BASELINE_COMMIT" BASELINE_STATUS="$BASELINE_STATUS" \
          EVIDENCE_PATH=".artifacts/pdf-merge/full/gate-evidence.json" \
          node scripts/certification/generate-gates.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-full
          path: .artifacts/pdf-merge/full
          if-no-files-found: error

  release:
    name: PDF Merge — Release Decision
    needs: [fast, medium, correctness, browser, stability, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download all gate evidence
        uses: actions/download-artifact@v7
        with:
          pattern: pdf-merge-${{ github.sha }}-*
          path: .artifacts/pdf-merge/downloads
          merge-multiple: false
      - name: Evaluate unified release decision
        env:
          TOOL: pdf-merge
          ARTIFACT_ROOT: .artifacts/pdf-merge/downloads
          REQUIRED_GATES: fast,medium,correctness,browser,stability,full
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/certification/release-decision.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pdf-merge-${{ github.sha }}-release
          path: .artifacts/pdf-merge/downloads/**/release
          if-no-files-found: warn
