name: Release Certification

on:
  workflow_run:
    workflows:
      - Tool Platform
      - Tool Release Candidate
    types: [completed]

concurrency:
  group: release-certification-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  certify:
    name: Release Certification Gate
    if: github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Release certification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/validate-release-certification.mjs
