name: Security Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/security/**"
      - "scripts/validate-security-hardening.mjs"
      - ".github/workflows/security-hardening.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: security-hardening-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate security hardening
        run: node scripts/validate-security-hardening.mjs
      - name: Production vulnerability audit
        run: npm audit --omit=dev --audit-level=high
