name: DAST Advisory

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL of the staging/preview deployment to scan
        required: true
        default: https://git-develop-flexo1.vercel.app
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run ZAP baseline
        continue-on-error: true
        run: |
          mkdir -p zap-results
          docker run --rm \
            -v "$PWD/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ inputs.target_url }}" \
            -r zap-report.html \
            -J zap-report.json || true
      - name: Publish DAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-report
          path: zap-results/
          if-no-files-found: ignore
